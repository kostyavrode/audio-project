# Добавьте эти блоки в /etc/nginx/sites-available/audio-kostya.online
# ПЕРЕД блоком location /test/

# Статические файлы для тестовой среды (CSS, JS, изображения, шрифты)
location ~ ^/test/(css|js|images|fonts)/ {
    alias /opt/test/audio-project/site/$1/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# API endpoints для тестовой среды (уже должны быть, но проверьте)
location ~ ^/test/api/Auth/(.*)$ {
    proxy_pass http://127.0.0.1:10001/api/Auth/$1;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection keep-alive;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;
}

